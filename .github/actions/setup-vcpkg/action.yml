name: Set up vcpkg
description: Checks out vcpkg at the builtin-baseline commit, bootstraps it as VCPKG_ROOT and restores the binary cache.

inputs:
  cache-suffix:
    description: Appended to the cache key and restore prefix, for jobs whose vcpkg ABI differs from the shared one.
    default: ""
  extra-hash-files:
    description: Glob hashed into the cache key in addition to the vcpkg manifests, for jobs that depend on extra files such as overlay ports.
    default: ""

outputs:
  cache-hit:
    description: "true when the binary cache was restored from an exact key match."
    value: ${{ steps.cache.outputs.cache-hit }}
  cache-key:
    description: Key to pass to actions/cache/save.
    value: ${{ steps.key.outputs.key }}

runs:
  using: composite
  steps:
    # The runner image's preinstalled vcpkg is a mutable checkout that can predate the baseline, so clone vcpkg
    # explicitly and detach at the exact builtin-baseline SHA from vcpkg.json. The tool and the port versions then
    # always come from the same commit.
    - name: Check out vcpkg at the pinned baseline
      shell: bash
      run: |
        baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
        if [ -z "$baseline" ]; then
          echo "::error::builtin-baseline not found in vcpkg.json"
          exit 1
        fi
        vcpkg_dir="$RUNNER_TEMP/vcpkg"
        rm -rf "$vcpkg_dir"
        git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git "$vcpkg_dir"
        git -C "$vcpkg_dir" checkout --quiet --detach "$baseline"
        test "$(git -C "$vcpkg_dir" rev-parse HEAD)" = "$baseline"
        if [ "$RUNNER_OS" = "Windows" ]; then
          "$vcpkg_dir/bootstrap-vcpkg.bat" -disableMetrics
        else
          "$vcpkg_dir/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$vcpkg_dir" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
    # One cache per OS: Debug, Release and sanitizer jobs share the same vcpkg ABI. Jobs only restore; a designated
    # job per OS saves on main (see build-and-test.yml), so PRs never write duplicate multi-GB entries.
    - name: Compute vcpkg binary cache key
      id: key
      shell: bash
      run: echo "key=vcpkg-${{ runner.os }}${{ inputs.cache-suffix }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}${{ inputs.extra-hash-files != '' && format('-{0}', hashFiles(inputs.extra-hash-files)) || '' }}" >> "$GITHUB_OUTPUT"
    - name: Restore vcpkg binary cache
      id: cache
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: ${{ steps.key.outputs.key }}
