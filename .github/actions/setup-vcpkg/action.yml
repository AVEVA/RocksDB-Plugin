name: Set up vcpkg
description: Checks out vcpkg at the builtin-baseline commit, bootstraps it as VCPKG_ROOT and restores the binary cache.

inputs:
  cache-key:
    description: Job-specific part of the binary cache key, after the runner OS prefix.
    required: true
  restore-key:
    description: Job-specific part of the fallback cache key prefix, after the runner OS prefix. Defaults to the OS only.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The runner image's preinstalled vcpkg is a mutable checkout that can predate the baseline, so clone vcpkg
    # explicitly and detach at the exact builtin-baseline SHA from vcpkg.json. The tool and the port versions then
    # always come from the same commit.
    - name: Check out vcpkg at the pinned baseline
      shell: bash
      run: |
        baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]\{40\}\)".*/\1/p' vcpkg.json)
        if [ -z "$baseline" ]; then
          echo "::error::builtin-baseline not found in vcpkg.json"
          exit 1
        fi
        vcpkg_dir="$RUNNER_TEMP/vcpkg"
        rm -rf "$vcpkg_dir"
        git clone --quiet --filter=blob:none https://github.com/microsoft/vcpkg.git "$vcpkg_dir"
        git -C "$vcpkg_dir" checkout --quiet --detach "$baseline"
        test "$(git -C "$vcpkg_dir" rev-parse HEAD)" = "$baseline"
        if [ "$RUNNER_OS" = "Windows" ]; then
          "$vcpkg_dir/bootstrap-vcpkg.bat" -disableMetrics
        else
          "$vcpkg_dir/bootstrap-vcpkg.sh" -disableMetrics
        fi
        echo "VCPKG_ROOT=$vcpkg_dir" >> "$GITHUB_ENV"
        echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
        mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"
    - name: Restore vcpkg binary cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/vcpkg-binary-cache
        key: vcpkg-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'infrastructure/vcpkg-overlays/**') }}
        restore-keys: vcpkg-${{ runner.os }}-${{ inputs.restore-key }}
