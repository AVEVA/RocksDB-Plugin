name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_db_bench:
        description: Also build tools/db_bench against the vcpkg RocksDB overlay (slow)
        type: boolean
        default: false

permissions:
  contents: read

# A new push supersedes an in-flight PR run; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Same file set as the pre-commit hook, so a commit that passed the hook never fails here.
      - name: Check clang-format
        run: |
          git ls-files -z -- 'src/*' 'include/*' 'tests/*' 'libs/*' \
            | grep -zE '\.(c|cc|cpp|cxx|h|hh|hpp|hxx)$' \
            | xargs -0 clang-format --dry-run --Werror --style=file

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: WindowsDebug
            tests: true
          - os: ubuntu-latest
            preset: LinuxDebug
            tests: true
          - os: ubuntu-latest
            preset: LinuxRelease
            config: Release
            tests: true
          # Release/packaging-style configure: tests off, so GTest (vcpkg "testing" feature) must not be needed.
          - os: ubuntu-latest
            preset: LinuxDebug
            tests: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: build-${{ matrix.preset }}-tests-${{ matrix.tests }}
          restore-key: build-${{ matrix.preset }}-

      # Plugin tests and the vendored AzureClient/HttpClient test suites.
      - name: Configure
        if: matrix.tests
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure (tests off, no vcpkg testing feature)
        if: ${{ !matrix.tests }}
        run: >
          cmake --preset ${{ matrix.preset }}
          -DAVEVA_ROCKSDB_TESTS=OFF
          -DVCPKG_MANIFEST_FEATURES=

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config || 'Debug' }}

      # Live Azure tests are opt-in (AVEVA_RUN_AZURE_INTEGRATION_TESTS=1) and never run here.
      - name: Test
        if: matrix.tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --build-config ${{ matrix.config || 'Debug' }} --parallel 4

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -DAVEVA_ROCKSDB_SANITIZER=address;undefined
          - name: tsan
            flags: -DAVEVA_ROCKSDB_SANITIZER=thread
    name: sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: sanitizers-${{ matrix.name }}

      - name: Configure
        run: cmake --preset LinuxDebug "${{ matrix.flags }}"

      # The flags value contains a ';'. It is passed as one quoted argument, so CMake stores a two-element list; fail
      # fast if a shell change ever splits it and a sanitizer is silently dropped.
      - name: Verify sanitizer flags reached CMake
        run: |
          grep -E '^AVEVA_ROCKSDB_SANITIZER:STRING=' build/LinuxDebug/CMakeCache.txt
          for san in $(echo "${{ matrix.flags }}" | sed 's/.*SANITIZER=//; s/;/ /g'); do
            grep -E "^AVEVA_ROCKSDB_SANITIZER:STRING=.*\b${san}\b" build/LinuxDebug/CMakeCache.txt
          done

      - name: Build
        run: cmake --build build/LinuxDebug --config Debug

      - name: Test
        run: ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug --parallel 4

  db-bench:
    # Opt-in: builds the patched RocksDB overlay and tools/db_bench, which no other job exercises.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_db_bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: db-bench

      - name: Configure and build with db_bench
        run: |
          cmake --preset LinuxRelease -DAVEVA_ROCKSDB_TESTS=OFF -DAVEVA_ROCKSDB_BUILD_DB_BENCH=ON
          cmake --build build/LinuxRelease --config Release

  install-consume:
    # Installs the libraries, then configures and builds a minimal external consumer that includes the public headers
    # and links the plugin, to validate the package configs and that the installed headers are self-sufficient.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: LinuxRelease
            triplet: x64-linux
          - os: windows-latest
            preset: WindowsRelease
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg
        with:
          cache-key: install-${{ matrix.preset }}

      - name: Configure, build and install
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} -DAVEVA_ROCKSDB_TESTS=OFF -DVCPKG_MANIFEST_FEATURES=
          cmake --build build/${{ matrix.preset }} --config Release
          cmake --install build/${{ matrix.preset }} --config Release --prefix "$RUNNER_TEMP/stage"

      # Reuses the packages the install build already restored, so the consumer needs no second vcpkg install.
      - name: Configure external consumer
        shell: bash
        run: |
          mkdir consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(consumer CXX)
          find_package(aveva-http-client CONFIG REQUIRED)
          find_package(aveva-azure-client CONFIG REQUIRED)
          find_package(aveva-rocksdb-plugin-azure CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE aveva::rocksdb-plugin-azure)
          target_compile_features(consumer PRIVATE cxx_std_23)
          EOF
          cat > main.cpp <<'EOF'
          #include <AVEVA/RocksDB/Plugin/Azure/BlobFilesystem.hpp>
          #include <AVEVA/RocksDB/Plugin/Azure/Plugin.hpp>
          #include <AVEVA/RocksDB/Plugin/Azure/ReadableFile.hpp>

          int main() { return 0; }
          EOF
          cmake -S . -B out -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/stage" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/vcpkg_installed"

      - name: Build external consumer
        shell: bash
        run: cmake --build consumer/out --config Release