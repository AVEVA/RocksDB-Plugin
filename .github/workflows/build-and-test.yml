name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_db_bench:
        description: Also build tools/db_bench against the vcpkg RocksDB overlay (slow)
        type: boolean
        default: false

permissions:
  contents: read

# A new push supersedes an in-flight PR run; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: WindowsDebug
            tests: true
          - os: ubuntu-latest
            preset: LinuxDebug
            tests: true
          - os: ubuntu-latest
            preset: LinuxRelease
            config: Release
            tests: true
          # Release/packaging-style configure: tests off, so GTest (vcpkg "testing" feature) must not be needed.
          - os: ubuntu-latest
            preset: LinuxDebug
            tests: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      # The runner image's vcpkg checkout can predate the builtin-baseline commit, which fails configure.
      - name: Fetch the vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-tests-${{ matrix.tests }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'infrastructure/vcpkg-overlays/**') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      # Plugin tests and the vendored AzureClient/HttpClient test suites.
      - name: Configure
        if: matrix.tests
        run: cmake --preset ${{ matrix.preset }}

      - name: Configure (tests off, no vcpkg testing feature)
        if: ${{ !matrix.tests }}
        run: >
          cmake --preset ${{ matrix.preset }}
          -DAVEVA_ROCKSDB_TESTS=OFF
          -DVCPKG_MANIFEST_FEATURES=

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config || 'Debug' }}

      # Live Azure tests are opt-in (AVEVA_RUN_AZURE_INTEGRATION_TESTS=1) and never run here.
      - name: Test
        if: matrix.tests
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --build-config ${{ matrix.config || 'Debug' }} --parallel 4

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -DAVEVA_AZURE_CLIENT_ENABLE_ASAN=ON -DAVEVA_AZURE_CLIENT_ENABLE_UBSAN=ON
          - name: tsan
            flags: -DAVEVA_AZURE_CLIENT_ENABLE_TSAN=ON
    name: sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      - name: Fetch the vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-sanitizers-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'infrastructure/vcpkg-overlays/**') }}
          restore-keys: vcpkg-

      - name: Configure
        run: cmake --preset LinuxDebug ${{ matrix.flags }}

      - name: Build
        run: cmake --build build/LinuxDebug --config Debug

      - name: Test
        run: ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug --parallel 4

  db-bench:
    # Opt-in: builds the patched RocksDB overlay and tools/db_bench, which no other job exercises.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_db_bench }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      - name: Fetch the vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-db-bench-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'infrastructure/vcpkg-overlays/**') }}
          restore-keys: vcpkg-

      - name: Configure and build with db_bench
        run: |
          cmake --preset LinuxRelease -DAVEVA_ROCKSDB_TESTS=OFF -DAVEVA_ROCKSDB_BUILD_DB_BENCH=ON
          cmake --build build/LinuxRelease --config Release

  install-consume:
    # Installs the libraries and configures a minimal external consumer to validate the package configs.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      - name: Fetch the vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-install-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'infrastructure/vcpkg-overlays/**') }}
          restore-keys: vcpkg-

      - name: Configure, build and install
        run: |
          cmake --preset LinuxRelease -DAVEVA_ROCKSDB_TESTS=OFF -DVCPKG_MANIFEST_FEATURES=
          cmake --build build/LinuxRelease --config Release
          cmake --install build/LinuxRelease --config Release --prefix "$RUNNER_TEMP/stage"

      - name: Configure external consumer
        run: |
          mkdir consumer && cd consumer
          printf 'cmake_minimum_required(VERSION 3.25)\nproject(consumer CXX)\nfind_package(aveva-http-client CONFIG REQUIRED)\nfind_package(aveva-azure-client CONFIG REQUIRED)\nfind_package(aveva-rocksdb-plugin-azure CONFIG REQUIRED)\n' > CMakeLists.txt
          cmake -S . -B out -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/stage" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
