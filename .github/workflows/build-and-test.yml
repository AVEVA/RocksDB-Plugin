name: Build and test

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_db_bench:
        description: Also build tools/db_bench against the vcpkg RocksDB overlay (slow)
        type: boolean
        default: false

permissions:
  contents: read

# A new push supersedes an in-flight PR run; main and manual runs are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  format-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      # Same file set as the pre-commit hook, so a commit that passed the hook never fails here.
      # The version is pinned: formatting differs between majors. Keep it in sync with CONTRIBUTING.md and devdoctor.ps1.
      - name: Check clang-format
        env:
          CLANG_FORMAT_VERSION: 22.1.3
        run: |
          pipx run "clang-format==$CLANG_FORMAT_VERSION" --version
          git ls-files -z -- 'src/*' 'include/*' 'tests/*'           'libs/*' 'tools/*' \
                      | grep -zE '\.(c|cc|cpp|cxx|h|hh|hpp|hxx|ipp)$' \
            | xargs -0 pipx run "clang-format==$CLANG_FORMAT_VERSION" --dry-run --Werror --style=file

  overlay-patches:
    # Fails fast (without the slow overlay build) when the RocksDB overlay patches no longer apply to the pinned
    # source archive, e.g. after a version or SHA512 bump.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Check RocksDB overlay patches apply
        run: |
          overlay=infrastructure/vcpkg-overlays/rocksdb
          version=$(jq -r .version "$overlay/vcpkg.json")
          sha512=$(sed -n 's/^ *SHA512 \([0-9a-f]\{128\}\).*/\1/p' "$overlay/portfile.cmake")
          patches=$(sed -n '/^ *PATCHES/,/^)/p' "$overlay/portfile.cmake" | grep -E '\.patch$' | tr -d ' ')
          [ -n "$sha512" ] && [ -n "$patches" ] || { echo "Could not read SHA512 or PATCHES from the portfile"; exit 1; }
          archive="$RUNNER_TEMP/rocksdb.tar.gz"
          src="$RUNNER_TEMP/rocksdb-src"
          curl -fsSL -o "$archive" "https://github.com/facebook/rocksdb/archive/refs/tags/v${version}.tar.gz"
          echo "$sha512  $archive" | sha512sum --check
          mkdir "$src"
          tar -xzf "$archive" -C "$src" --strip-components=1
          # Outside a repository, git apply fails on any hunk that no longer matches.
          for p in $patches; do
            echo "Applying $p"
            git -C "$src" apply --verbose "$GITHUB_WORKSPACE/$overlay/$p"
          done

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: WindowsDebug
            tests: true
            save-cache: true
          - os: ubuntu-latest
            preset: LinuxDebug
            tests: true
            save-cache: true
          - os: ubuntu-latest
            preset: LinuxRelease
            config: Release
            tests: true
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg

      # Plugin tests and the vendored AzureClient/HttpClient test suites.
      # The tests-off configure (no vcpkg testing feature) is covered by the install-consume job.
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config ${{ matrix.config || 'Debug' }}

      # Live Azure tests are opt-in (AVEVA_RUN_AZURE_INTEGRATION_TESTS=1) and never run here.
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --build-config ${{ matrix.config || 'Debug' }} --parallel 4

      # One writer per OS, on main only; an exact hit means the entry already exists.
      - name: Save vcpkg binary cache
        if: ${{ success() && matrix.save-cache && github.ref == 'refs/heads/main' && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg.outputs.cache-key }}

  sanitizers:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: asan-ubsan
            flags: -DAVEVA_ROCKSDB_SANITIZER=address;undefined
          - name: tsan
            flags: -DAVEVA_ROCKSDB_SANITIZER=thread
    name: sanitizers (${{ matrix.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg

      - name: Configure
        run: cmake --preset LinuxDebug "${{ matrix.flags }}"

      # The flags value contains a ';'. It is passed as one quoted argument, so CMake stores a two-element list; fail
      # fast if a shell change ever splits it and a sanitizer is silently dropped.
      - name: Verify sanitizer flags reached CMake
        run: |
          grep -E '^AVEVA_ROCKSDB_SANITIZER:STRING=' build/LinuxDebug/CMakeCache.txt
          for san in $(echo "${{ matrix.flags }}" | sed 's/.*SANITIZER=//; s/;/ /g'); do
            grep -E "^AVEVA_ROCKSDB_SANITIZER:STRING=.*\b${san}\b" build/LinuxDebug/CMakeCache.txt
          done

      - name: Build
        run: cmake --build build/LinuxDebug --config Debug

      - name: Test
        if: matrix.name != 'tsan'
        env:
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug --parallel 4

      # TSan is 5-15x slower and reports on the first race, so the deterministic Core and HttpClient suites run first as
      # their own step: a failure there points at the library, not at the timing-sensitive plugin and AzureClient tests.
      - name: Test (tsan, Core and HttpClient)
        if: matrix.name == 'tsan'
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan.supp halt_on_error=1 second_deadlock_stack=1
        run: ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug --parallel 4 -L 'core|http-client'

      - name: Test (tsan, remaining suites)
        if: matrix.name == 'tsan'
        env:
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/.github/tsan.supp halt_on_error=1 second_deadlock_stack=1
        run: ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug --parallel 4 -LE 'core|http-client'

  db-bench:
    # Builds the patched RocksDB overlay and tools/db_bench, which no other job exercises. Runs on manual request and on
    # every push to main; on pull requests only when they touch something the tool is built from (the overlay build is
    # slow).
    if: ${{ (github.event_name == 'workflow_dispatch' && inputs.build_db_bench) || github.event_name == 'pull_request' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Detect relevant changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The checkout is the PR merge commit, so only the base tip is needed to list what the PR changes.
          git fetch --quiet --depth=1 origin "$BASE_SHA"
          # Not piped into $GITHUB_OUTPUT directly so a failing diff fails this step instead of selecting a skip.
          result="$(bash .github/scripts/detect-relevant-changes.sh "$BASE_SHA")"
          echo "$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = "relevant=false" ]; then
            echo "No library, overlay or db_bench changes; skipping."
          fi

      # Own cache key: this job's RocksDB ABI differs from the build matrix, so it must not share their entry.
      - uses: ./.github/actions/setup-vcpkg
        id: vcpkg
        if: steps.changes.outputs.relevant == 'true'
        with:
          cache-suffix: -db-bench

      - name: Configure and build with db_bench
        if: steps.changes.outputs.relevant == 'true'
        run: |
          cmake --preset LinuxRelease -DAVEVA_ROCKSDB_TESTS=OFF -DAVEVA_ROCKSDB_BUILD_DB_BENCH=ON
          cmake --build build/LinuxRelease --config Release

      - name: Save vcpkg binary cache
        if: ${{ success() && steps.changes.outputs.relevant == 'true' && github.ref == 'refs/heads/main' && steps.vcpkg.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg.outputs.cache-key }}

  install-consume:
    # Installs the libraries, then configures and builds a minimal external consumer that includes the public headers
    # and links the plugin (plus one executable per separately installable package), to validate the package configs
    # and that the installed headers are self-sufficient.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            preset: LinuxRelease
            triplet: x64-linux
          - os: windows-latest
            preset: WindowsRelease
            triplet: x64-windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-vcpkg

      - name: Configure, build and install
        shell: bash
        run: |
          cmake --preset ${{ matrix.preset }} -DAVEVA_ROCKSDB_TESTS=OFF -DVCPKG_MANIFEST_FEATURES=
          cmake --build build/${{ matrix.preset }} --config Release
          cmake --install build/${{ matrix.preset }} --config Release --prefix "$RUNNER_TEMP/stage"

      # Reuses the packages the install build already restored, so the consumer needs no second vcpkg install.
      - name: Configure external consumer
        shell: bash
        run: |
          mkdir consumer && cd consumer
          cat > CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)
          project(consumer CXX)
          find_package(aveva-rocksdb-plugin-azure CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE aveva::rocksdb-plugin-azure)
          target_compile_features(consumer PRIVATE cxx_std_23)

          # One executable per separately installable package, so a broken find_dependency in any of their
          # config templates fails here instead of only when a consumer picks that package on its own.
          foreach(pkg IN ITEMS http_client azure_client core azure_impl)
            if(pkg STREQUAL "http_client")
              set(pkg_name aveva-http-client)
              set(pkg_target aveva::http-client)
            elseif(pkg STREQUAL "azure_client")
              set(pkg_name aveva-azure-client)
              set(pkg_target aveva::azure-client)
            elseif(pkg STREQUAL "core")
              set(pkg_name aveva-rocksdb-plugin-core)
              set(pkg_target aveva::rocksdb-plugin-core)
            else()
              set(pkg_name aveva-rocksdb-plugin-azure-impl)
              set(pkg_target aveva::rocksdb-plugin-azure-impl)
            endif()
            find_package(${pkg_name} CONFIG REQUIRED)
            add_executable(consume_${pkg} ${pkg}.cpp)
            target_link_libraries(consume_${pkg} PRIVATE ${pkg_target})
            target_compile_features(consume_${pkg} PRIVATE cxx_std_23)
          endforeach()
          EOF
          cat > http_client.cpp <<'EOF'
          #include <AVEVA/HttpClient/HttpMethod.hpp>

          int main(int argc, char**) {
              if (argc > 100) {
                  return static_cast<int>(AVEVA::ToString(AVEVA::HttpMethod::Get).size());
              }
              return 0;
          }
          EOF
          cat > azure_client.cpp <<'EOF'
          #include <AVEVA/AzureClient/BlobStorageErrorCode.hpp>

          int main(int argc, char**) {
              if (argc > 100) {
                  return AVEVA::AzureClient::make_error_code(AVEVA::AzureClient::BlobStorageErrorCode::BlobNotFound)
                      .value();
              }
              return 0;
          }
          EOF
          cat > core.cpp <<'EOF'
          #include <AVEVA/RocksDB/Plugin/Core/Util.hpp>

          int main(int argc, char**) {
              if (argc > 100) {
                  return static_cast<int>(AVEVA::RocksDB::Plugin::Core::StringHash{}(std::string_view("unused")));
              }
              return 0;
          }
          EOF
          # Plugin::UniquePrefix is a public API; the link has to resolve it from the installed library.
          cat > azure_impl.cpp <<'EOF'
          #include <AVEVA/RocksDB/Plugin/Azure/Impl/Configuration.hpp>
          #include <AVEVA/RocksDB/Plugin/Azure/Plugin.hpp>

          int main(int argc, char**) {
              if (argc > 100) {
                  return static_cast<int>(AVEVA::RocksDB::Plugin::Azure::Plugin::UniquePrefix("https://a.b/", "c").size());
              }
              return AVEVA::RocksDB::Plugin::Azure::Impl::Configuration::MaxClientRetries > 0 ? 0 : 1;
          }
          EOF
          cat > main.cpp <<'EOF'
          #include <AVEVA/RocksDB/Plugin/Azure/BlobFilesystem.hpp>
          #include <AVEVA/RocksDB/Plugin/Azure/Plugin.hpp>
          #include <AVEVA/RocksDB/Plugin/Azure/ReadableFile.hpp>

          // The runtime guard keeps the call from executing but still forces the linker to resolve the symbol and
          // its transitive dependencies.
          int main(int argc, char**) {
              if (argc > 100) {
                  AVEVA::RocksDB::Plugin::Azure::Plugin::Unregister(std::string("unused"));
              }
              return 0;
          }
          EOF
          cmake -S . -B out -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/stage" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/vcpkg_installed"

      - name: Build external consumer
        shell: bash
        run: cmake --build consumer/out --config Release

      # Source compatibility with consumers written against main: old-style Plugin::Register calls and normal
      # rocksdb::FileSystem usage, compiled and linked against the installed package (tests/consumer).
      - name: Configure and build main-API consumer
        shell: bash
        run: |
          cmake -S tests/consumer -B consumer-main-api -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/stage" \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_MANIFEST_MODE=OFF -DVCPKG_TARGET_TRIPLET=${{ matrix.triplet }} \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/build/${{ matrix.preset }}/vcpkg_installed"
          cmake --build consumer-main-api --config Release