name: Build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            preset: WindowsDebug
          - os: ubuntu-latest
            preset: LinuxDebug
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Point VCPKG_ROOT at the preinstalled vcpkg
        shell: bash
        run: |
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$RUNNER_TEMP/vcpkg-binary-cache" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/vcpkg-binary-cache"

      # The runner image's vcpkg checkout can predate the builtin-baseline commit, which fails configure.
      - name: Fetch the vcpkg baseline commit
        shell: bash
        run: |
          baseline=$(sed -n 's/.*"builtin-baseline": *"\([0-9a-f]*\)".*/\1/p' vcpkg.json)
          git -C "$VCPKG_INSTALLATION_ROOT" cat-file -e "$baseline^{commit}" 2>/dev/null ||
            git -C "$VCPKG_INSTALLATION_ROOT" fetch --quiet origin "$baseline"

      - name: Restore vcpkg binary cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: vcpkg-${{ matrix.preset }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: vcpkg-${{ matrix.preset }}-

      # Plugin tests, the vendored AzureClient/HttpClient test suites and the installed-package consumer test.
      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DAVEVA_BUILD_CLIENT_LIBRARY_TESTS=ON
          -DAVEVA_ROCKSDB_PACKAGE_TEST=ON

      - name: Build
        run: cmake --build build/${{ matrix.preset }} --config Debug

      # Integration tests skip themselves when no Azure credentials are present.
      - name: Test
        run: ctest --test-dir build/${{ matrix.preset }} --output-on-failure --build-config Debug --parallel 4
