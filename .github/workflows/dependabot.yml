name: Dependency Updates

on:
  push:
    branches:
      - main
      - "jss/**"
  schedule:
    - cron: "0 11 * * 1" # Weekly Monday at 4 AM MST
  workflow_dispatch:
    inputs:
      force:
        description: "Force PR creation even if build fails"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  update-vcpkg:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git ${{ runner.temp }}/vcpkg
          & "${{ runner.temp }}/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=${{ runner.temp }}/vcpkg" >> $env:GITHUB_ENV

      - name: Update vcpkg baseline
        id: update
        shell: pwsh
        run: |
          # Get current baseline from vcpkg-configuration.json
          $config = Get-Content vcpkg-configuration.json | ConvertFrom-Json
          $currentBaseline = $config.'default-registry'.baseline
          Write-Host "Current baseline: $currentBaseline"

          # Get latest vcpkg commit
          Push-Location $env:VCPKG_ROOT
          git fetch origin
          $latestCommit = git rev-parse origin/master
          Pop-Location
          Write-Host "Latest vcpkg commit: $latestCommit"

          if ($currentBaseline -eq $latestCommit) {
            Write-Host "Already up to date."
            echo "updated=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          # Update baseline in vcpkg-configuration.json
          $content = Get-Content vcpkg-configuration.json -Raw
          $content = $content -replace $currentBaseline, $latestCommit
          Set-Content vcpkg-configuration.json $content

          echo "updated=true" >> $env:GITHUB_OUTPUT
          echo "old_baseline=$currentBaseline" >> $env:GITHUB_OUTPUT
          echo "new_baseline=$latestCommit" >> $env:GITHUB_OUTPUT

      - name: Verify build
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: |
          cmake --preset LinuxDebug
          cmake --build build/LinuxDebug --config Debug

      - name: Run tests
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        run: |
          ctest --test-dir build/LinuxDebug --output-on-failure --build-config Debug

      - name: Create or update Pull Request
        if: steps.update.outputs.updated == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $branch = "dependabot/vcpkg-baseline"
          $title = "chore(deps): update vcpkg baseline"
          $body = @"
          ## Automated vcpkg dependency update

          Updates vcpkg baseline from ``${{ steps.update.outputs.old_baseline }}`` to ``${{ steps.update.outputs.new_baseline }}``.

          ### Verification
          - [x] Linux Debug build passes
          - [x] Tests pass

          ---
          *This PR was created automatically by the dependency update workflow.*
          "@

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B $branch
          git add vcpkg-configuration.json
          git commit -m $title
          git push --force-with-lease origin $branch

          $existingPr = gh pr list --head $branch --json number --jq '.[0].number'
          if ($existingPr) {
            gh pr edit $existingPr --body $body
            Write-Host "Updated existing PR #$existingPr"
          } else {
            gh pr create --title $title --body $body --label "dependencies" --base main
            Write-Host "Created new PR"
          }
