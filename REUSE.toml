version = 1

[[annotations]]
path = "libs/**"
precedence = "aggregate"
SPDX-FileCopyrightText = "Copyright 2026 AVEVA"
SPDX-License-Identifier = "Apache-2.0"

# Culture-ordering tables and comparator ported from the Azure SDK for C++.
[[annotations]]
path = "libs/AzureClient/src/SharedKeySigner.cpp"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) Microsoft Corporation.", "Copyright 2026 AVEVA"]
SPDX-License-Identifier = "MIT AND Apache-2.0"

# Derived from bemanproject/exemplar.
[[annotations]]
path = "libs/*/infrastructure/cmake/aveva-install-library-config.cmake"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) Beman Project contributors", "Copyright 2026 AVEVA"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"

# Files that cannot carry an inline header: JSON has no comment syntax, and GitHub parses the
# front matter or body of these markdown files (agents, skills, instructions, issue/PR templates).
[[annotations]]
path = [
    "*.json",
    ".vscode/*.json",
    ".github/policies/*.json",
    ".github/copilot-instructions.md",
    ".github/agents/*.agent.md",
    ".github/skills/**/SKILL.md",
    ".github/ISSUE_TEMPLATE/*.md",
    ".github/PULL_REQUEST_TEMPLATE.md",
]
SPDX-FileCopyrightText = "Copyright 2025 AVEVA"
SPDX-License-Identifier = "Apache-2.0"

# Pre-existing non-source files: licensed here rather than via inline headers to keep history and blame clean.
[[annotations]]
path = [
    ".clang-format",
    ".clang-tidy",
    ".editorconfig",
    ".gitignore",
    ".github/CODEOWNERS",
    ".github/dependabot.yml",
    ".github/agents/README.md",
    ".github/hooks/README.md",
    ".github/hooks/pre-commit",
    ".github/workflows/assign-random-reviewers.yml",
    "AGENTS.md",
    "ARCHITECTURE.md",
    "CMakeLists.txt",
    "CONTRIBUTING.md",
    "README.md",
    "SECURITY.md",
    "devdoctor.ps1",
    "src/**/CMakeLists.txt",
    "src/**/*.cmake.in",
    "tests/**/CMakeLists.txt",
    "tools/**/CMakeLists.txt",
    "tools/**/README.md",
    "infrastructure/vcpkg-overlays/**",
]
SPDX-FileCopyrightText = "Copyright 2025 AVEVA"
SPDX-License-Identifier = "Apache-2.0"

# Derived from bemanproject/exemplar.
[[annotations]]
path = "infrastructure/cmake/aveva-install-library-config.cmake"
precedence = "override"
SPDX-FileCopyrightText = ["Copyright (c) Beman Project contributors", "Copyright 2026 AVEVA"]
SPDX-License-Identifier = "Apache-2.0 WITH LLVM-exception"
